[build-system]
requires = ["setuptools>=70.1"]

[project]
name = "runai-model-streamer"
dependencies = [
    "torch>=2.0.0, <3.0.0",
    "humanize",
    "numpy",
]
# version comes from PACKAGE_VERSION, and the extras pin this wheel's own version of the
# storage backends, so both are set in setup.py; license files are set there too
# (see the comment on license_files).
dynamic = ["version", "optional-dependencies"]
