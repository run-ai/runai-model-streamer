name: RunAI Model Streamer Library - Pull Request
on:
  pull_request:

jobs:
  lifecycle-install-tests:
    name: Test, Build & Push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Set PACKAGE_VERSION
      run: echo "PACKAGE_VERSION=0.0.0+dev.$(git rev-parse --short HEAD)" >> $GITHUB_ENV

    - name: Run tests and build
      uses: devcontainers/ci@v0.3
      with:
        imageName: ghcr.io/run-ai/runai-model-streamer/devcontainer
        cacheFrom: ghcr.io/run-ai/runai-model-streamer/devcontainer
        push: never
        runCmd: |
          # TEMPORARY diagnostic - can CI exercise io_uring? Two layers decide it: the runner
          # kernel's sysctl, and the container's seccomp profile. devcontainer.json sets
          # seccomp=unconfined and those runArgs reach here, so only the kernel layer is unknown.
          # Remove this and the probe run below once the answer is in notes_async_io.md.
          echo "io_uring_disabled = $(cat /proc/sys/kernel/io_uring_disabled 2>&1)"
          grep -i Seccomp /proc/self/status || true
          make test && \
          PACKAGE_VERSION=${{ env.PACKAGE_VERSION }} make build
          # TEMPORARY, and deliberately after the build so it cannot fail the PR. The probe test
          # calls io_uring_setup through ::syscall directly, so it reports the kernel's own answer
          # rather than the code under test. --nocache_test_results stops a cached PASSED from
          # hiding the log line that carries the errno.
          (cd cpp && bazel test //posix_io/io_uring_probe:io_uring_probe_test \
              --test_output=all --nocache_test_results) || true

    - name: Upload streamer package to github action
      uses: actions/upload-artifact@v4
      with:
        name: runai_model_streamer
        path: py/runai_model_streamer/dist/*
        if-no-files-found: error

    - name: Upload s3 streamer package to github action
      uses: actions/upload-artifact@v4
      with:
        name: runai_model_streamer_s3
        path: py/runai_model_streamer_s3/dist/*
        if-no-files-found: error

    - name: Upload GCS streamer package to github action
      uses: actions/upload-artifact@v4
      with:
        name: runai_model_streamer_gcs
        path: py/runai_model_streamer_gcs/dist/*
        if-no-files-found: error

    - name: Upload Azure streamer package to github action
      uses: actions/upload-artifact@v4
      with:
        name: runai_model_streamer_azure
        path: py/runai_model_streamer_azure/dist/*
        if-no-files-found: error
