name: Build and Push DevContainer

on:
  create:
  push:
    branches:
      - master
      - 'release/*'
    paths:
      - '.devcontainer/**'
      - '.github/workflows/devcontainer.yml'
      - '.github/workflows/build-devcontainer.yml'
      - '.github/workflows/on-pr.yaml'
  workflow_dispatch:

concurrency:
  group: publish-devcontainer-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  select-branch:
    name: Select devcontainer branch
    runs-on: ubuntu-24.04
    outputs:
      publish: ${{ steps.branch.outputs.publish }}
      baseline_tag: ${{ steps.branch.outputs.baseline_tag }}
    steps:
    - name: Select branch image tag
      id: branch
      shell: bash
      env:
        BRANCH: ${{ github.ref_name }}
        REF_TYPE: ${{ github.ref_type }}
        EVENT_NAME: ${{ github.event_name }}
        BRANCH_CREATED: ${{ github.event.created }}
      run: |
        set -euo pipefail
        # The create event initializes release branches, including empty diffs.
        # Ignore tags and the duplicate push event for a newly created branch.
        if [[ "$REF_TYPE" != branch ||
              ( "$EVENT_NAME" == push && "$BRANCH_CREATED" == true ) ||
              ( "$EVENT_NAME" == create && "$BRANCH" == master ) ]]; then
          exit 0
        fi
        if [[ "$BRANCH" == master ]]; then
          tag=latest
        elif [[ "$BRANCH" =~ ^release/[0-9]+\.[0-9]+$ ]]; then
          tag="release-${BRANCH#release/}"
        else
          exit 0
        fi
        printf 'publish=true\nbaseline_tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"

  build-devcontainer-amd64:
    name: Build & Push AMD64 DevContainer Image
    needs: select-branch
    if: needs.select-branch.outputs.publish == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/devcontainer.yml
    with:
      architecture: amd64
      publish: true
      baseline_tag: ${{ needs.select-branch.outputs.baseline_tag }}

  build-devcontainer-arm64:
    name: Build & Push ARM64 DevContainer Image
    needs: select-branch
    if: needs.select-branch.outputs.publish == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/devcontainer.yml
    with:
      architecture: arm64
      publish: true
      baseline_tag: ${{ needs.select-branch.outputs.baseline_tag }}

  publish-manifest:
    name: Publish multi-architecture devcontainer tag
    needs: [select-branch, build-devcontainer-amd64, build-devcontainer-arm64]
    if: needs.select-branch.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Publish generic tag from this run's image digests
      env:
        BASELINE_TAG: ${{ needs.select-branch.outputs.baseline_tag }}
        AMD64_IMAGE: ${{ needs.build-devcontainer-amd64.outputs.published_image }}
        ARM64_IMAGE: ${{ needs.build-devcontainer-arm64.outputs.published_image }}
      run: |
        set -euo pipefail
        repository="$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
        image="ghcr.io/$repository/devcontainer:$BASELINE_TAG"
        docker buildx imagetools create --tag "$image" "$AMD64_IMAGE" "$ARM64_IMAGE"
        docker buildx imagetools inspect "$image"
