name: Build devcontainer

on:
  workflow_call:
    inputs:
      architecture:
        description: Native candidate architecture (amd64 or arm64); empty preserves the existing dual-architecture image.
        type: string
        default: ''
      baseline_tag:
        description: Published branch image tag to update or use as a build cache.
        type: string
        default: latest
      publish:
        description: Push to GHCR; otherwise export the image as a workflow artifact.
        type: boolean
        default: false
    outputs:
      image:
        description: Fully qualified image tag to run.
        value: ${{ jobs.build.outputs.image }}
      artifact:
        description: Image artifact name when publish is false.
        value: ${{ jobs.build.outputs.artifact }}

jobs:
  build:
    name: Build devcontainer image
    runs-on: ${{ inputs.architecture == 'arm64' && 'ubuntu-24.04-arm' || inputs.architecture == 'amd64' && 'ubuntu-24.04' || 'ubuntu-latest' }}
    outputs:
      image: ${{ steps.image.outputs.image }}
      artifact: ${{ steps.image.outputs.artifact }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v5
      with:
        persist-credentials: false

    - name: Select image tag
      id: image
      shell: bash
      env:
        PUBLISH: ${{ inputs.publish }}
        BASELINE_TAG: ${{ inputs.baseline_tag }}
        ARCHITECTURE: ${{ inputs.architecture }}
      run: |
        set -euo pipefail
        if [[ "$BASELINE_TAG" != latest && ! "$BASELINE_TAG" =~ ^release-[0-9]+\.[0-9]+$ ]]; then
          echo "::error::Unsupported devcontainer baseline tag" >&2
          exit 1
        fi
        case "$ARCHITECTURE" in
          '') suffix=; dependency_arches='amd64 arm64' ;;
          amd64|arm64) suffix="-$ARCHITECTURE"; dependency_arches="$ARCHITECTURE" ;;
          *) echo "::error::Unsupported devcontainer architecture: $ARCHITECTURE" >&2; exit 1 ;;
        esac
        repository="$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
        image_name="ghcr.io/${repository}/devcontainer"
        tag="$BASELINE_TAG$suffix"
        artifact=
        if [[ "$PUBLISH" != true ]]; then
          tag="pr-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}${suffix}"
          artifact="ci-devcontainer-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}${suffix}"
        fi
        printf 'name=%s\ntag=%s\nimage=%s:%s\nartifact=%s\n' \
          "$image_name" "$tag" "$image_name" "$tag" "$artifact" >> "$GITHUB_OUTPUT"
        printf 'baseline_image=%s:%s%s\ndependency_arches=%s\n' \
          "$image_name" "$BASELINE_TAG" "$suffix" "$dependency_arches" >> "$GITHUB_OUTPUT"

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Select available branch cache
      id: cache
      shell: bash
      env:
        BASELINE_IMAGE: ${{ steps.image.outputs.baseline_image }}
      run: |
        set -euo pipefail
        if docker manifest inspect "$BASELINE_IMAGE" > /dev/null 2>&1; then
          printf 'image=%s\n' "$BASELINE_IMAGE" >> "$GITHUB_OUTPUT"
        else
          echo "Branch cache unavailable; building the devcontainer from source."
        fi

    - name: Build devcontainer
      uses: devcontainers/ci@v0.3
      env:
        DEVCONTAINER_DEPENDENCY_ARCHES: ${{ steps.image.outputs.dependency_arches }}
      # Build for the runner's native platform and keep the image in Docker for export.
      with:
        imageName: ${{ steps.image.outputs.name }}
        imageTag: ${{ steps.image.outputs.tag }}
        cacheFrom: ${{ steps.cache.outputs.image }}
        push: ${{ inputs.publish && 'always' || 'never' }}

    - name: Export devcontainer image
      if: ${{ !inputs.publish }}
      env:
        CI_IMAGE: ${{ steps.image.outputs.image }}
      run: docker save --output "$RUNNER_TEMP/devcontainer.tar" "$CI_IMAGE"

    - name: Upload devcontainer image
      if: ${{ !inputs.publish }}
      uses: actions/upload-artifact@v6
      with:
        name: ${{ steps.image.outputs.artifact }}
        path: ${{ runner.temp }}/devcontainer.tar
        if-no-files-found: error
        compression-level: 1
        retention-days: 1
