name: Build devcontainer

on:
  workflow_call:
    inputs:
      architecture:
        description: Native image architecture (amd64 or arm64).
        type: string
        required: true
      baseline_tag:
        description: Published branch image tag to update or use as a build cache.
        type: string
        default: latest
      publish:
        description: Push to GHCR; otherwise export the image for PR build and test jobs.
        type: boolean
        default: false
    outputs:
      image:
        description: Fully qualified image tag to run.
        value: ${{ jobs.build.outputs.image }}
      artifact:
        description: Image artifact name for PR builds; empty for published builds.
        value: ${{ jobs.build.outputs.artifact }}
      published_image:
        description: Immutable image reference after publication, for manifest assembly.
        value: ${{ jobs.build.outputs.published_image }}

jobs:
  build:
    name: Build devcontainer image
    runs-on: ${{ inputs.architecture == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    outputs:
      image: ${{ steps.image.outputs.image }}
      artifact: ${{ steps.image.outputs.artifact }}
      published_image: ${{ steps.publish.outputs.image }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v5
      with:
        persist-credentials: false

    - name: Select image tag
      id: image
      shell: bash
      env:
        PUBLISH: ${{ inputs.publish }}
        BASELINE_TAG: ${{ inputs.baseline_tag }}
        ARCHITECTURE: ${{ inputs.architecture }}
      run: |
        set -euo pipefail
        if [[ "$BASELINE_TAG" != latest && ! "$BASELINE_TAG" =~ ^release-[0-9]+\.[0-9]+$ ]]; then
          echo "::error::Unsupported devcontainer baseline tag" >&2
          exit 1
        fi
        case "$ARCHITECTURE" in
          amd64|arm64) suffix="-$ARCHITECTURE"; dependency_arches="$ARCHITECTURE" ;;
          *) echo "::error::Unsupported devcontainer architecture: $ARCHITECTURE" >&2; exit 1 ;;
        esac
        repository="$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
        image_name="ghcr.io/${repository}/devcontainer"
        tag="$BASELINE_TAG$suffix"
        artifact=
        if [[ "$PUBLISH" != true ]]; then
          tag="pr-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}${suffix}"
          artifact="ci-devcontainer-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}${suffix}"
        fi
        printf 'name=%s\ntag=%s\nimage=%s:%s\nartifact=%s\n' \
          "$image_name" "$tag" "$image_name" "$tag" "$artifact" >> "$GITHUB_OUTPUT"
        printf 'baseline_image=%s:%s%s\ndependency_arches=%s\n' \
          "$image_name" "$BASELINE_TAG" "$suffix" "$dependency_arches" >> "$GITHUB_OUTPUT"

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Select available branch cache
      id: cache
      shell: bash
      env:
        BASELINE_IMAGE: ${{ steps.image.outputs.baseline_image }}
      run: |
        set -euo pipefail
        if docker manifest inspect "$BASELINE_IMAGE" > /dev/null 2>&1; then
          printf 'image=%s\n' "$BASELINE_IMAGE" >> "$GITHUB_OUTPUT"
        else
          echo "Branch cache unavailable; building the devcontainer from source."
        fi

    - name: Build devcontainer
      uses: devcontainers/ci@v0.3
      env:
        DEVCONTAINER_DEPENDENCY_ARCHES: ${{ steps.image.outputs.dependency_arches }}
      # Use the runner's native platform; publish explicitly below to capture its digest.
      with:
        imageName: ${{ steps.image.outputs.name }}
        imageTag: ${{ steps.image.outputs.tag }}
        cacheFrom: ${{ steps.cache.outputs.image }}
        push: never

    - name: Publish native image
      id: publish
      if: inputs.publish
      shell: bash
      env:
        IMAGE: ${{ steps.image.outputs.image }}
        IMAGE_NAME: ${{ steps.image.outputs.name }}
      run: |
        set -euo pipefail
        docker push "$IMAGE"
        resolved=$(docker image inspect "$IMAGE" --format '{{json .RepoDigests}}' \
          | jq -r --arg prefix "$IMAGE_NAME@" '[.[]? | select(startswith($prefix))][0] // empty')
        if [[ ! "$resolved" =~ @sha256:[0-9a-f]{64}$ ]]; then
          echo '::error::Could not resolve the published native image digest.' >&2
          exit 1
        fi
        printf 'image=%s\n' "$resolved" >> "$GITHUB_OUTPUT"

    - name: Export devcontainer image
      if: steps.image.outputs.artifact != ''
      env:
        CI_IMAGE: ${{ steps.image.outputs.image }}
      run: docker save --output "$RUNNER_TEMP/devcontainer.tar" "$CI_IMAGE"

    - name: Upload devcontainer image
      if: steps.image.outputs.artifact != ''
      uses: actions/upload-artifact@v6
      with:
        name: ${{ steps.image.outputs.artifact }}
        path: ${{ runner.temp }}/devcontainer.tar
        if-no-files-found: error
        compression-level: 1
        retention-days: 1
